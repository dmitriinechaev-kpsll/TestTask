version: '3.8'

services:
  # Наше Spring Boot приложение
  app:
    build: .
    container_name: archtst-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/archtst_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    networks:
      - archtst-network

  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: archtst-postgres
    environment:
      - POSTGRES_DB=archtst_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"  # Хост:5433 → Контейнер:5432 (чтобы не конфликтовать с локальной БД)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - archtst-network

volumes:
  postgres-data:
    name: archtst-postgres-data

networks:
  archtst-network:
    name: archtst-network