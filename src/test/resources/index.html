<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Users API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>👥 Управление пользователями</h2>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createUserModal">
            <i class="bi bi-person-plus"></i> Добавить пользователя
        </button>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form class="row g-3" onsubmit="event.preventDefault(); fetchUsers();">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="searchName" placeholder="Поиск по имени...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Найти</button>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-secondary w-100" onclick="clearSearch()">Сбросить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Возраст</th>
                        <th>Роли</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="createUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новый пользователь</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createUserForm" onsubmit="createUser(event)">
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" id="createName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="createEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Возраст</label>
                        <input type="number" class="form-control" id="createAge" required min="1" max="150">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addressesModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Адреса пользователя</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="currentUserIdForAddresses">
                
                <form class="row g-2 mb-4" onsubmit="addAddress(event)">
                    <div class="col-md-3">
                        <select class="form-select" id="addrType" required>
                            <option value="HOME">HOME</option>
                            <option value="WORK">WORK</option>
                            <option value="BILLING">BILLING</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="addrCity" placeholder="Город" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="addrStreet" placeholder="Улица" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="addrHouse" placeholder="Дом" required>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </form>

                <ul class="list-group" id="addressesList">
                    </ul>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="rolesModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">🛡️ Роли пользователя</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="currentUserIdForRoles">
                
                <form class="d-flex mb-4" onsubmit="addRole(event)">
                    <select class="form-select me-2" id="newRoleName" required>
                        <option value="" disabled selected>Выберите роль...</option>
                        <option value="ROLE_USER">USER</option>
                        <option value="ROLE_ADMIN">ADMIN</option>
                        <option value="ROLE_MANAGER">MANAGER</option>
                        <option value="ROLE_TESTER">TESTER</option>
                    </select>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Выдать</button>
                </form>

                <h6 class="text-muted">Текущие роли:</h6>
                <ul class="list-group" id="rolesList">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'http://localhost:8080/api/v1/users';
    let usersData = []; // Глобальный массив для хранения юзеров в памяти

    // 1. ЗАГРУЗКА И ПОИСК ПОЛЬЗОВАТЕЛЕЙ (ЧЕРЕЗ ТВОЙ POST /search)
    async function fetchUsers() {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = '<tr><td colspan="6" class="text-center placeholder-glow"><span class="placeholder col-6"></span></td></tr>';

        const nameQuery = document.getElementById('searchName').value.trim();

        // Собираем JSON-тело по твоей схеме из Swagger
        const searchBody = {
	    names: nameQuery ? [nameQuery] : [], // Если пусто - отправляем пустой массив, а не null
            page: 0,
            size: 50,
            sortBy: "createdAt", // Меняем id на createdAt, как в примере
            sortDir: "DESC"
        };

        // Если пользователь ввел имя, добавляем его в массив names, как просит твой DTO
        if (nameQuery) {
            searchBody.names = [nameQuery];
        }

        try {
            // Отправляем POST запрос на твой крутой эндпоинт /search
            const response = await fetch(`${API_URL}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(searchBody)
            });
            
            if (!response.ok) throw new Error('Ошибка сервера: ' + response.status);
            
            const pageData = await response.json();
            usersData = pageData.content; // Сохраняем загруженных юзеров
            renderTable(usersData);
        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">${error.message}</td></tr>`;
        }
    }

    function clearSearch() {
        document.getElementById('searchName').value = '';
        fetchUsers();
    }

    function renderTable(users) {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = ''; 

        if (users.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Ничего не найдено</td></tr>';
            return;
        }

        users.forEach(user => {
            const rolesStr = user.roles && user.roles.length > 0 
                ? user.roles.map(r => `<span class="badge bg-primary me-1">${r}</span>`).join('') 
                : '<span class="badge bg-secondary">НЕТ РОЛЕЙ</span>';
            
            tableBody.innerHTML += `
                <tr>
                    <td class="text-muted small" title="${user.id}">${user.id.substring(0, 6)}...</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.email}</td>
                    <td>${user.age || '-'}</td>
                    <td>${rolesStr}</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-info" onclick="openAddressesModal('${user.id}')" title="Адреса"><i class="bi bi-geo-alt"></i></button>
                            <button class="btn btn-outline-warning" onclick="openRolesModal('${user.id}')" title="Роли"><i class="bi bi-shield-lock"></i></button>
                            <button class="btn btn-outline-danger" onclick="deleteUser('${user.id}')" title="Удалить"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    // 2. ДОБАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯ (POST)
    async function createUser(event) {
        event.preventDefault(); 
        const data = {
            name: document.getElementById('createName').value,
            email: document.getElementById('createEmail').value,
            age: parseInt(document.getElementById('createAge').value)
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                bootstrap.Modal.getInstance(document.getElementById('createUserModal')).hide();
                document.getElementById('createUserForm').reset();
                fetchUsers();
            } else {
                const err = await response.json();
                alert('Ошибка создания: ' + (err.message || response.status));
            }
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    // 3. УДАЛЕНИЕ ПОЛЬЗОВАТЕЛЯ (DELETE)
    async function deleteUser(id) {
        if (!confirm('Точно удалить этого пользователя? (Soft Delete)')) return;
        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) fetchUsers();
            else alert('Не удалось удалить. Статус: ' + response.status);
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    // =================================================================
    // 4. РАБОТА С АДРЕСАМИ 
    // =================================================================
    
    async function openAddressesModal(userId) {
        document.getElementById('currentUserIdForAddresses').value = userId;
        const modal = new bootstrap.Modal(document.getElementById('addressesModal'));
        modal.show();
        loadAddresses(userId);
    }

    async function loadAddresses(userId) {
        const list = document.getElementById('addressesList');
        list.innerHTML = '<li class="list-group-item text-center">Загрузка...</li>';

        try {
            const response = await fetch(`${API_URL}/${userId}/addresses`);
            if (!response.ok) throw new Error('Ошибка: ' + response.status);
            
            const pageData = await response.json();
            const addresses = pageData.content; 

            list.innerHTML = '';
            if (addresses.length === 0) {
                list.innerHTML = '<li class="list-group-item text-center text-muted">Адресов пока нет</li>';
                return;
            }

            addresses.forEach(addr => {
                let badgeColor = 'bg-secondary';
                if (addr.type === 'HOME') badgeColor = 'bg-success';
                else if (addr.type === 'WORK') badgeColor = 'bg-primary';
                else if (addr.type === 'BILLING') badgeColor = 'bg-warning text-dark';
                else if (addr.type === 'OTHER') badgeColor = 'bg-info text-dark';

                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge ${badgeColor} me-2">${addr.type}</span>
                            г. ${addr.city}, ул. ${addr.street}, д. ${addr.houseNumber}
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deleteAddress('${userId}', '${addr.id}')"><i class="bi bi-x"></i></button>
                    </li>
                `;
            });
        } catch (error) { list.innerHTML = `<li class="list-group-item text-danger text-center">${error.message}</li>`; }
    }

    async function addAddress(event) {
        event.preventDefault();
        const userId = document.getElementById('currentUserIdForAddresses').value;
        const data = {
            type: document.getElementById('addrType').value,
            city: document.getElementById('addrCity').value,
            street: document.getElementById('addrStreet').value,
            houseNumber: document.getElementById('addrHouse').value
        };

        try {
            const response = await fetch(`${API_URL}/${userId}/addresses`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                event.target.reset(); 
                loadAddresses(userId); 
            } else {
                const err = await response.json();
                alert('Не удалось добавить: ' + (err.message || response.status));
            }
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    async function deleteAddress(userId, addressId) {
        try {
            const response = await fetch(`${API_URL}/${userId}/addresses/${addressId}`, { method: 'DELETE' });
            if (response.ok) loadAddresses(userId);
            else alert('Не удалось удалить.');
        } catch (error) { alert('Ошибка сети'); }
    }

    // =================================================================
    // 5. РАБОТА С РОЛЯМИ 
    // =================================================================

    function openRolesModal(userId) {
        document.getElementById('currentUserIdForRoles').value = userId;
        
        // Достаем юзера из сохраненных данных
        const user = usersData.find(u => u.id === userId);
        renderRolesList(userId, user.roles || []);
        
        const modal = new bootstrap.Modal(document.getElementById('rolesModal'));
        modal.show();
    }

    function renderRolesList(userId, roles) {
        const list = document.getElementById('rolesList');
        list.innerHTML = '';

        if (roles.length === 0) {
            list.innerHTML = '<li class="list-group-item text-center text-muted">У пользователя нет ролей</li>';
            return;
        }

        roles.forEach(roleName => {
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>${roleName}</strong>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeRole('${userId}', '${roleName}')">
                        <i class="bi bi-trash"></i> Забрать
                    </button>
                </li>
            `;
        });
    }

    async function addRole(event) {
        event.preventDefault();
        const userId = document.getElementById('currentUserIdForRoles').value;
        const data = { roleName: document.getElementById('newRoleName').value };

        try {
            const response = await fetch(`${API_URL}/${userId}/roles`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const updatedUser = await response.json(); 
                document.getElementById('newRoleName').value = ''; 
                renderRolesList(userId, updatedUser.roles || []); 
                fetchUsers(); // Фоновое обновление таблицы
            } else {
                const err = await response.json();
                alert('Ошибка: ' + (err.message || response.status));
            }
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    async function removeRole(userId, roleName) {
        try {
            const response = await fetch(`${API_URL}/${userId}/roles/${roleName}`, { method: 'DELETE' });
            
            if (response.ok) {
                const updatedUser = await response.json(); 
                renderRolesList(userId, updatedUser.roles || []); 
                fetchUsers(); // Фоновое обновление таблицы
            } else {
                const err = await response.json();
                alert('Ошибка: ' + (err.message || response.status));
            }
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    // Запускаем при открытии
    window.onload = fetchUsers;
</script>

</body>
</html>
