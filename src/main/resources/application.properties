spring.application.name=archtst
spring.application.version=1.0.0

# ============================================
# POSTGRESQL DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/archtst_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# FLYWAY CONFIGURATION
# ============================================
# ???????? Flyway
spring.flyway.enabled=true
# (???????????) ???? ???? ?? ??????, Flyway ??????? ??????? ??????? ???????? ??? ??????
spring.flyway.baseline-on-migrate=true

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ============================================
# LOGGING
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ??? Spring Boot 3 (Hibernate 6) // ??? ???????, ????? ??????
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.archtst=DEBUG

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.error.include-message=always

# ============================================
# APPLICATION INFO
# ============================================
#info.app.name=Archtst API
#info.app.version=1.0.0
#info.app.description=3-Layer Architecture with PostgreSQL